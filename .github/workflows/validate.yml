name: Validate skill distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate metadata and links
        run: python scripts/validate.py
      - name: Exercise package and installer behavior
        run: python -m unittest discover -s tests -v
